name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - name: Build and test
        run: |
          scripts/docker-build.sh test
          scripts/docker-build.sh
      - name: Validate tag and package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml)"
          test "$RELEASE_TAG" = "v$VERSION"
          scripts/package-release.sh "$VERSION"
      - uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: dist/
          retention-days: 7
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: linux-x86_64
          path: dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG is already published."
            exit 0
          fi
          gh release create "$RELEASE_TAG" \
            --verify-tag --title "refusion $RELEASE_TAG" \
            --notes "Native parametric CAD for Linux. Download the Linux x86-64 archive, verify its SHA-256 checksum, and extract it. Run ./refusion examples/bracket.rfz from the extracted directory. Requires glibc 2.36 or newer and working desktop graphics drivers. See the README for features, controls, and current limitations." \
            dist/refusion-*.tar.gz dist/refusion-*.sha256
